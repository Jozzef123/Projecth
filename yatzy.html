<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatzy Multiplayer - Gaming Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f87c56; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .game-card { background: #ffe4d6; width: 100%; max-width: 420px; border-radius: 20px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .room-info { font-weight: bold; color: #444; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .section-box { background: #fdf3ed; border-radius: 12px; padding: 8px; border: 2px solid #f1c5b4; }
        
        .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding: 4px; background: #fff; border-radius: 8px; font-weight: bold; }
        .score-row .label { font-size: 14px; color: #333; }
        .cell { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
        .cell.p1 { background: #ff7675; color: white; }
        .cell.p2 { background: #74b9ff; color: white; }
        .cell.selectable { border: 2px dashed #2ed573; background: #eccc68 !important; color: #000; }

        .dice-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .die { width: 60px; height: 60px; background: white; border: 3px solid #ccc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .die.held { border-color: #2ed573; background: #a8e6cf; transform: translateY(-4px); }

        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; }
        .btn-roll { background: #eb4d4b; }
        .btn-roll:disabled { background: #ccc; }
        .turn-status { text-align: center; font-weight: bold; margin-top: 10px; color: #2d3436; }
    </style>
</head>
<body data-game="yatzy">

<a href="index.html" style="display:block; max-width:420px; width:100%; margin:0 auto 10px; color:#fff; text-decoration:none;">&#8592; Back to main menu</a>

<div class="game-card">
    <div class="top-bar">
        <div class="room-info" id="roomDisplay">الغرفة: ----</div>
        <div id="roleDisplay">Player: -</div>
    </div>

    <!-- Shareable room link (shown after a room is created) -->
    <div id="shareBox" style="display:none; text-align:center; margin-bottom:12px;">
        <p style="font-size:13px; color:#444; margin:0 0 6px;">Send this link to your friend so they can play with you:</p>
        <div style="display:flex; gap:6px; justify-content:center;">
            <input type="text" id="shareLink" readonly style="flex:1; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid #f1c5b4; background:#fff; color:#333; font-size:13px;">
            <button id="copyBtn" style="padding:8px 14px; border:none; border-radius:8px; background:#2ed573; color:#fff; font-weight:bold; cursor:pointer;">Copy</button>
        </div>
        <p style="font-size:12px; color:#777; margin:6px 0 0;">Waiting for another player to join...</p>
    </div>

    <!-- Scorecard Grid -->
    <div class="grid-container">
        <!-- Upper Section -->
        <div class="section-box">
            <div class="score-row"><span class="label">⚀ 1</span><div class="cell p1" onclick="selectCat('ones')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">⚁ 2</span><div class="cell p1" onclick="selectCat('twos')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">⚂ 3</span><div class="cell p1" onclick="selectCat('threes')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">⚃ 4</span><div class="cell p1" onclick="selectCat('fours')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">⚄ 5</span><div class="cell p1" onclick="selectCat('fives')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">⚅ 6</span><div class="cell p1" onclick="selectCat('sixes')"></div><div class="cell p2"></div></div>
        </div>

        <!-- Lower Section -->
        <div class="section-box">
            <div class="score-row"><span class="label">3x</span><div class="cell p1" onclick="selectCat('3x')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">4x</span><div class="cell p1" onclick="selectCat('4x')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">🏠 House</span><div class="cell p1" onclick="selectCat('house')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">🏢 Small</span><div class="cell p1" onclick="selectCat('small')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">🏰 Large</span><div class="cell p1" onclick="selectCat('large')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">🎯 Yatzy</span><div class="cell p1" onclick="selectCat('yatzy')"></div><div class="cell p2"></div></div>
            <div class="score-row"><span class="label">❓ Chance</span><div class="cell p1" onclick="selectCat('chance')"></div><div class="cell p2"></div></div>
        </div>
    </div>

    <!-- Dice Area -->
    <div class="dice-bar">
        <div class="die" onclick="toggleHold(0)">-</div>
        <div class="die" onclick="toggleHold(1)">-</div>
        <div class="die" onclick="toggleHold(2)">-</div>
        <div class="die" onclick="toggleHold(3)">-</div>
        <div class="die" onclick="toggleHold(4)">-</div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-roll" id="rollBtn" onclick="rollDice()">ROLL (3)</button>
    </div>

    <div style="margin-top:8px;">
        <button id="endMatchBtn" style="width:100%; padding:10px; border:none; border-radius:12px; background:#636e72; color:#fff; font-weight:bold; cursor:pointer;">End Match</button>
    </div>
    
    <div class="turn-status" id="turnStatus">Waiting for the opponent...</div>
</div>

    <!-- Parent Mode: when the limit is reached the game scripts below are not
         loaded at all, so no board is rendered and no room is created. -->
    <script src="parent_mode.js"></script>
    <script>
        if (!window.PARENT_MODE_LOCKED) {
            document.write('<script src="end_game_helper.js"><\/script>');
            document.write('<script src="yatzy.js"><\/script>');
        }
    </script>
</body>
</html>
