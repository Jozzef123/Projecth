<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X and O - Gaming Hub</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2b2b44);
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
    }
    a.back-link {
        align-self: flex-start;
        color: #b3b3cc;
        text-decoration: none;
        margin-bottom: 20px;
        font-size: 14px;
    }
    a.back-link:hover { color: white; }

    h1 { margin: 0 0 6px 0; }
    .subtitle { color: #b3b3cc; margin-bottom: 30px; }

    .panel {
        background: #2f2f4a;
        border-radius: 16px;
        padding: 30px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .spinner {
        width: 46px; height: 46px;
        border: 5px solid #444466;
        border-top-color: #28a745;
        border-radius: 50%;
        margin: 20px auto;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .link-box {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .link-box input {
        flex: 1;
        min-width: 200px;
        padding: 10px 12px;
        border-radius: 6px;
        border: none;
        background: #1e1e2f;
        color: white;
        font-size: 13px;
    }
    .link-box button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #28a745;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .link-box button:hover { opacity: 0.9; }

    .score-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .score-pill, .role-tag {
        display: inline-block;
        background: #444466;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
    }
    .role-tag { margin-bottom: 18px; }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: min(100%, 330px);
        margin: 18px auto 16px auto;
    }
    .cell-btn {
        aspect-ratio: 1;
        background: #1e1e2f;
        border: 3px solid #444466;
        border-radius: 14px;
        color: white;
        font-size: clamp(42px, 12vw, 68px);
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .cell-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        border-color: #28a745;
    }
    .cell-btn:disabled {
        cursor: not-allowed;
        opacity: 0.75;
    }
    .cell-btn.x { color: #28a745; }
    .cell-btn.o { color: #ffc107; }

    .turn-note {
        margin-top: 16px;
        color: #b3b3cc;
        font-size: 14px;
        min-height: 20px;
    }

    .result-msg {
        font-size: 24px;
        font-weight: bold;
        margin: 10px 0 10px 0;
    }
    .result-msg.win  { color: #28a745; }
    .result-msg.lose { color: #dc3545; }
    .result-msg.draw { color: #ffc107; }
    .result-board { margin-top: 10px; }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        margin: 6px;
        font-size: 16px;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }
    .btn-primary { background: #28a745; }
    .btn-primary:hover { opacity: 0.9; }

    .error-box {
        background: #4a1f27;
        border: 1px solid #dc3545;
        border-radius: 10px;
        padding: 20px;
        color: #ffb3bd;
    }

    .hidden { display: none !important; }
</style>
</head>
<body data-game="xo">

    <a href="index.html" class="back-link">&#8592; Back to main menu</a>
    <h1>X and O</h1>
    <p class="subtitle">Play Tic-Tac-Toe online with a friend</p>

    <div class="panel">

        <div id="waitingScreen">
            <div class="spinner"></div>
            <div id="waitingText">Setting up the room...</div>
            <div id="shareBox" class="hidden">
                <p>Send this link to your friend so they can play with you:</p>
                <div class="link-box">
                    <input type="text" id="shareLink" readonly>
                    <button id="copyBtn">Copy</button>
                </div>
                <p class="turn-note">Waiting for another player to join...</p>
            </div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="score-row">
                <span class="score-pill" id="xScore">X wins: 0</span>
                <span class="score-pill" id="oScore">O wins: 0</span>
                <span class="score-pill" id="drawScore">Draws: 0</span>
            </div>
            <div class="role-tag" id="roleTag"></div>
            <div id="turnPrompt">Waiting for the board...</div>
            <div class="board" id="gameBoard">
                <button class="cell-btn" data-index="0"></button>
                <button class="cell-btn" data-index="1"></button>
                <button class="cell-btn" data-index="2"></button>
                <button class="cell-btn" data-index="3"></button>
                <button class="cell-btn" data-index="4"></button>
                <button class="cell-btn" data-index="5"></button>
                <button class="cell-btn" data-index="6"></button>
                <button class="cell-btn" data-index="7"></button>
                <button class="cell-btn" data-index="8"></button>
            </div>
            <div class="turn-note" id="turnNote"></div>
        </div>

        <div id="resultScreen" class="hidden">
            <div class="score-row">
                <span class="score-pill" id="resultXScore">X wins: 0</span>
                <span class="score-pill" id="resultOScore">O wins: 0</span>
                <span class="score-pill" id="resultDrawScore">Draws: 0</span>
            </div>
            <div class="role-tag" id="resultRoleTag"></div>
            <div class="result-msg" id="resultMsg"></div>
            <div class="board result-board" id="resultBoard">
                <button class="cell-btn" data-result-index="0" disabled></button>
                <button class="cell-btn" data-result-index="1" disabled></button>
                <button class="cell-btn" data-result-index="2" disabled></button>
                <button class="cell-btn" data-result-index="3" disabled></button>
                <button class="cell-btn" data-result-index="4" disabled></button>
                <button class="cell-btn" data-result-index="5" disabled></button>
                <button class="cell-btn" data-result-index="6" disabled></button>
                <button class="cell-btn" data-result-index="7" disabled></button>
                <button class="cell-btn" data-result-index="8" disabled></button>
            </div>
            <div>
                <button class="btn btn-primary" id="nextRoundBtn">Play again</button>
                <button class="btn" id="endMatchBtn" style="background:#6c757d; margin-left:8px;">End Match</button>
            </div>
        </div>

        <div id="errorScreen" class="hidden">
            <div class="error-box" id="errorText"></div>
            <a href="xo.html" class="btn btn-primary" style="margin-top:16px;">Create a new room</a>
        </div>

    </div>

    <!-- Parent Mode: when the limit is reached the game scripts below are not
         loaded at all, so no board is rendered and no room is created. -->
    <script src="parent_mode.js"></script>
    <script>
        if (!window.PARENT_MODE_LOCKED) {
            document.write('<script src="end_game_helper.js"><\/script>');
            document.write('<script src="xo.js"><\/script>');
        }
    </script>
</body>
</html>
