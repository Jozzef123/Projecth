<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect 4 - Available now</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2b2b44);
        color: white;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
    }
    .icon { font-size: 64px; }
    h1 { margin: 0; }
    p { color: #b3b3cc; }
    a.back {
        margin-top: 20px;
        display: inline-block;
        padding: 12px 25px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }
    a.back:hover { opacity: 0.9; }
</style>
</head>
<body data-game="connect4">
    <a class="back" href="index.html">&#8592; Back to main menu</a>
    <h1>Connect 4</h1>
    <p id="statusText">Room status: not connected</p>

    <div style="display:flex;gap:8px;align-items:center;">
        <button id="createBtn" class="back">Create Room</button>
        <input id="roomInput" placeholder="Room ID" style="padding:8px;border-radius:6px;border:1px solid #444;background:#2b2b44;color:#fff;">
        <button id="joinBtn" class="back">Join Room</button>
    </div>

    <div id="boardContainer" style="margin-top:16px;">
        <div id="game-board" style="width:420px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px;background:#2f2f4a;border-radius:8px;"></div>
    </div>

    <div style="margin-top:12px;">
        <button id="nextRound" class="back" style="background:#28a745;">Play again</button>
        <button id="endGame" class="back" style="background:#dc3545;">End match</button>
    </div>

    <!-- Parent Mode: when the limit is reached the game scripts below are not
         loaded at all, so no board is rendered and no room is created. -->
    <script src="parent_mode.js"></script>
    <script>
        if (!window.PARENT_MODE_LOCKED) {
            document.write('<script src="end_game_helper.js"><\/script>');
            document.write('<script src="connect4.js"><\/script>');
        }
    </script>
</body>
</html>
