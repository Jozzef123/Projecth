<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory - Gaming Hub</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2b2b44);
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
    }
    a.back-link {
        align-self: flex-start;
        color: #b3b3cc;
        text-decoration: none;
        margin-bottom: 20px;
        font-size: 14px;
    }
    a.back-link:hover { color: white; }

    h1 { margin: 0 0 6px 0; }
    .subtitle { color: #b3b3cc; margin-bottom: 30px; }

    .panel {
        background: #2f2f4a;
        border-radius: 16px;
        padding: 30px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .spinner {
        width: 46px; height: 46px;
        border: 5px solid #444466;
        border-top-color: #28a745;
        border-radius: 50%;
        margin: 20px auto;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .link-box {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .link-box input {
        flex: 1;
        min-width: 200px;
        padding: 10px 12px;
        border-radius: 6px;
        border: none;
        background: #1e1e2f;
        color: white;
        font-size: 13px;
    }
    .link-box button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #28a745;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .link-box button:hover { opacity: 0.9; }

    .score-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .score-pill, .role-tag {
        display: inline-block;
        background: #444466;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
    }
    .role-tag { margin-bottom: 14px; }

    .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: min(100%, 380px);
        margin: 18px auto 16px auto;
        perspective: 900px;
    }

    /* 3D flip card */
    .memory-card {
        position: relative;
        aspect-ratio: 1;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.45s ease;
        border-radius: 14px;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .memory-card.flipped { transform: rotateY(180deg) scale(1); }

    /* Subtle scale/hover effect on the card back */
    .memory-card:not(.flipped):hover { transform: scale(1.06); }

    /* Soft glow on matched pairs */
    .memory-card.matched {
        box-shadow: 0 0 18px 5px rgba(40, 167, 69, 0.75);
        border-radius: 14px;
    }

    .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
    }
    .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(34px, 10vw, 48px);
    }
    .card-back {
        background: linear-gradient(135deg, #28a745, #0d6efd);
        color: white;
        font-weight: bold;
        font-size: clamp(26px, 8vw, 36px);
    }
    .card-front {
        background: #1e1e2f;
        border: 3px solid #444466;
        transform: rotateY(180deg);
    }

    .turn-note { margin-top: 14px; color: #b3b3cc; }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        margin: 6px;
        font-size: 16px;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }
    .btn-primary { background: #28a745; }
    .btn-primary:hover { opacity: 0.9; }

    .result-msg { font-size: 22px; font-weight: bold; margin: 10px 0 20px 0; }

    .error-box {
        background: #4a1f27;
        border: 1px solid #dc3545;
        border-radius: 10px;
        padding: 20px;
        color: #ffb3bd;
    }

    .hidden { display: none !important; }
</style>
</head>
<body data-game="memory">

    <a href="index.html" class="back-link">&#8592; Back to main menu</a>
    <h1>&#127922; Memory</h1>
    <p class="subtitle">Match the pairs and beat your friend</p>

    <div class="panel">

        <!-- Waiting screen -->
        <div id="waitingScreen">
            <div class="spinner"></div>
            <div id="waitingText">Setting up the room...</div>
            <div id="shareBox" class="hidden">
                <p>Send this link to your friend so they can play with you:</p>
                <div class="link-box">
                    <input type="text" id="shareLink" readonly>
                    <button id="copyBtn">Copy</button>
                </div>
                <p class="turn-note">Waiting for another player to join...</p>
            </div>
        </div>

        <!-- Game screen -->
        <div id="gameScreen" class="hidden">
            <div class="score-row">
                <span class="score-pill" id="p1Score">Player 1: 0 pairs</span>
                <span class="score-pill" id="p2Score">Player 2: 0 pairs</span>
            </div>
            <div class="role-tag" id="roleTag"></div>
            <div id="turnPrompt">Waiting for the board...</div>
            <div class="board" id="memoryBoard"></div>
        </div>

        <!-- Result screen -->
        <div id="resultScreen" class="hidden">
            <div class="result-msg" id="resultMsg"></div>
            <div class="score-row" id="resultScore"></div>
            <div>
                <button class="btn btn-primary" id="nextRoundBtn">Play again</button>
                <button class="btn" id="endMatchBtn" style="background:#6c757d; margin-left:8px;">End Match</button>
            </div>
        </div>

        <!-- Error / ended screen -->
        <div id="errorScreen" class="hidden">
            <div class="error-box" id="errorText"></div>
            <a href="memory.html" class="btn btn-primary" style="margin-top:16px;">Create a new room</a>
        </div>

    </div>

    <!-- Parent Mode: when the limit is reached the game scripts below are not
         loaded at all, so no board is rendered and no room is created. -->
    <script src="parent_mode.js"></script>
    <script>
        if (!window.PARENT_MODE_LOCKED) {
            document.write('<script src="end_game_helper.js"><\/script>');
            document.write('<script src="memory.js"><\/script>');
        }
    </script>
</body>
</html>
