<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quiz - Gaming Hub</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2b2b44);
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
    }
    a.back-link {
        align-self: flex-start;
        color: #b3b3cc;
        text-decoration: none;
        margin-bottom: 20px;
        font-size: 14px;
    }
    a.back-link:hover { color: white; }
    h1 { margin: 0 0 6px 0; }
    .subtitle { color: #b3b3cc; margin-bottom: 30px; }
    .panel {
        background: #2f2f4a;
        border-radius: 16px;
        padding: 30px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .spinner {
        width: 46px; height: 46px;
        border: 5px solid #444466;
        border-top-color: #28a745;
        border-radius: 50%;
        margin: 20px auto;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .link-box {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .link-box input {
        flex: 1;
        min-width: 200px;
        padding: 10px 12px;
        border-radius: 6px;
        border: none;
        background: #1e1e2f;
        color: white;
        font-size: 13px;
    }
    .link-box button, .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        background: #28a745;
        color: white;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 6px;
    }
    .link-box button { padding: 10px 18px; margin: 0; }
    .link-box button:hover, .btn:hover { opacity: 0.9; }
    .score-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .score-pill, .role-tag {
        display: inline-block;
        background: #444466;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
    }
    .role-tag { margin-bottom: 18px; }
    .timer {
        width: 78px;
        height: 78px;
        margin: 0 auto 18px auto;
        border-radius: 50%;
        background: #1e1e2f;
        border: 4px solid #ffc107;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
    }
    .question {
        font-size: 42px;
        font-weight: bold;
        margin: 12px 0 22px 0;
    }
    .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    .choice-btn {
        min-height: 76px;
        background: #1e1e2f;
        border: 3px solid #444466;
        border-radius: 14px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s;
    }
    .choice-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        border-color: #28a745;
    }
    .choice-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }
    .choice-btn.selected {
        border-color: #ffc107;
        background: #4a3e1f;
    }
    .note {
        margin-top: 18px;
        color: #b3b3cc;
        font-size: 14px;
        min-height: 20px;
    }
    .result-msg {
        font-size: 24px;
        font-weight: bold;
        margin: 18px 0;
    }
    .result-msg.win { color: #28a745; }
    .result-msg.lose { color: #dc3545; }
    .result-msg.draw { color: #ffc107; }
    .error-box {
        background: #4a1f27;
        border: 1px solid #dc3545;
        border-radius: 10px;
        padding: 20px;
        color: #ffb3bd;
    }
    .hidden { display: none !important; }
    @media (max-width: 430px) {
        .choices { grid-template-columns: 1fr; }
    }
</style>
</head>
<body data-game="mathquiz">

    <a href="index.html" class="back-link">&#8592; Back to main menu</a>
    <h1>Math Quiz</h1>
    <p class="subtitle">Answer fast and beat your friend</p>

    <div class="panel">
        <div id="waitingScreen">
            <div class="spinner"></div>
            <div id="waitingText">Setting up the room...</div>
            <div id="shareBox" class="hidden">
                <p>Send this link to your friend so they can play with you:</p>
                <div class="link-box">
                    <input type="text" id="shareLink" readonly>
                    <button id="copyBtn">Copy</button>
                </div>
                <p class="note">Waiting for another player to join...</p>
            </div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="score-row">
                <span class="score-pill" id="p1Score">Player 1: 0</span>
                <span class="score-pill" id="p2Score">Player 2: 0</span>
            </div>
            <div class="role-tag" id="roleTag"></div>
            <div class="timer" id="timer">15</div>
            <div class="question" id="questionText">0 + 0</div>
            <div class="choices" id="choices"></div>
            <div class="note" id="answerNote"></div>
        </div>

        <div id="resultScreen" class="hidden">
            <div class="score-row">
                <span class="score-pill" id="resultP1Score">Player 1: 0</span>
                <span class="score-pill" id="resultP2Score">Player 2: 0</span>
            </div>
            <div class="role-tag" id="resultRoleTag"></div>
            <div class="question" id="resultQuestion">0 + 0</div>
            <div class="result-msg" id="resultMsg"></div>
            <div class="note" id="resultNote"></div>
            <div>
                <button class="btn" id="nextRoundBtn">Next question</button>
                <button class="btn" id="endMatchBtn" style="background:#6c757d; margin-left:8px;">End Match</button>
            </div>
        </div>

        <div id="errorScreen" class="hidden">
            <div class="error-box" id="errorText"></div>
            <a href="mathquiz.html" class="btn" style="margin-top:16px;">Create a new room</a>
        </div>
    </div>

    <!-- Parent Mode: when the limit is reached the game scripts below are not
         loaded at all, so no board is rendered and no room is created. -->
    <script src="parent_mode.js"></script>
    <script>
        if (!window.PARENT_MODE_LOCKED) {
            document.write('<script src="end_game_helper.js"><\/script>');
            document.write('<script src="mathquiz.js"><\/script>');
        }
    </script>
</body>
</html>
